[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "paperless-cf-ocr"
dynamic = ["version"]
description = "Paperless-ngx parser plugin: OCR with vision LLMs on Cloudflare Workers AI via AI Gateway"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
classifiers = [
  "Framework :: Django",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business",
]
# Runtime dependencies are intentionally empty: everything the plugin imports
# (httpx, pikepdf, Pillow, pypdfium2/pdf2image, ocrmypdf) ships with Paperless-ngx.
# The Docker init script installs with --no-deps so Paperless's own pins are never touched.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "httpx>=0.27", "ruff>=0.6", "pypdfium2>=5", "Pillow>=11", "fpdf2>=2.8"]

[project.entry-points."paperless_ngx.parsers"]
cf_ocr = "paperless_cf_ocr.parser:CloudflareOcrParser"

[tool.hatch.version]
path = "src/paperless_cf_ocr/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/paperless_cf_ocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
